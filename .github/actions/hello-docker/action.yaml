name: Hello World
author: Mohamed
description: "Greet someone ant record the time"
inputs:
  who_to_greet:
    description: "Who to greet"
    required: true
    default: "World"
outputs:
  time:
    description: "Time of greeting"
runs:
  using: docker
  image: "DockerFile"
  args:
    - ${{ inputs.who_to_greet }}
  env:
    HELLO: WORLD
  post-entrypoint: cleanup.sh
  post-if: runner.os == 'linux'
