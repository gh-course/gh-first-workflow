name: caching and artifacts
on: [workflow_dispatch]
jobs:
    use-axios:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Cache node modules
              id: cache-node-modules
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-npm-cache-
                      ${{ runner.os }}
            - name: Display Cache output
              run: echo '${{ toJson(steps.cache-node-modules.outputs) }}'
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
            - name: Upload test coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: test-coverage
                  path: coverage/
                  retention-days: 5
              if: always()
            - name: Download test coverage report
              uses: actions/download-artifact@v4
              with:
                  name: test-coverage
                  path: code-coverage-report
            - run: ls -R code-coverage-report
            - run: ls -a
              working-directory: code-coverage-report
            - name: Use Axios
              uses: actions/github-script@v9
              with:
                  script: |
                      const axios = require('axios');
                      const response = await axios.get('https://api.github.com/repos/actions/toolkit');
                      console.log(response.data);
