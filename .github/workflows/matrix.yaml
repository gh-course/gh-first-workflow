name: Matrix workflow
on: [push]
jobs:
    matrix-job:
        runs-on: ${{ matrix.os }}
        continue-on-error: true
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [20, 21, 22]
                include:
                    - os: ubuntu-latest
                      is-ubuntu: true
                    - environment: false
                    - os: macos-latest
                      node: 22
                    - os: ubuntu-latest
                      node: 20
                exclude:
                    - os: ubuntu-latest
                      node: 21
            fail-fast: false
        steps:
            - name: Node version before setup
              run: node --version
            - run: echo "${{ toJSON(matrix) }}"
            - name: Set up Node.js ${{ matrix.node }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node }}
            - name: Node version after setup
              run: node --version
