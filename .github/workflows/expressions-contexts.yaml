name: Expressions and Contexts
on: [push, issues]
run-name: "Expressions and Contexts by ${{ github.actor }} on ${{ github.repository }} - event: ${{ github.event_name }}"
jobs:
    run_for_issues_pr:
        if: contains(fromJSON('["issues", "pull_request"]'), github.event_name)
        runs-on: ubuntu-latest
        steps:
            - if: contains(github.event.issue.labels.*.name, 'bug')
              name: Display Bug Labels
              run: join(github.event.issue.labels.*.name, ', ')
    expressions-and-contexts:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: Expression
              id: expression
              run: |
                  echo ${{ true }}
                  echo ${{ 1> 2 }}
                  echo ${{ 'string' == 'String' }}
            - name: Dump Contexts
              run: |
                  echo "Github context: ${{ toJson(github) }}"
                  echo "Workflow context: ${{ toJson(secrets) }}"
                  echo "Job context: ${{ toJson(job) }}"
                  echo "Runner context: ${{ toJson(runner) }}"
                  echo "Steps context: ${{ toJson(steps) }}"
