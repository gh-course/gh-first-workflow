name: reusable workflow in the same repository
on:
    workflow_call:
        outputs:
            date:
                description: "Current date"
                value: ${{ jobs.output-date-job.outputs.date }}

jobs:
    call-another-reusable-workflow:
        uses: gh-course/workflows/.github/workflows/reusable.yaml@main
        with:
            name: ${{ github.event.inputs.name }}
        secrets:
            access-token: ${{ secrets.ACCESS_TOKEN }}
    output-date-job:
        runs-on: ubuntu-latest
        outputs:
            date: ${{ steps.get-date.outputs.date }}
        steps:
            - name: Get current date
              id: get-date
              run: echo "date=$(date)" >> $GITHUB_OUTPUT
