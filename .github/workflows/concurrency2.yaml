name: Concurrency Workflow 2
run-name: "Concurrency workflow 2 run for ${{ github.event.inputs.environment }}"
on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Enter a environment name"
                required: true
                type: environment
jobs:
    concurrency-job:
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.event.inputs.environment }}
            cancel-in-progress: true
        steps:
            - name: Sleep 30 seconds
              run: sleep 30
