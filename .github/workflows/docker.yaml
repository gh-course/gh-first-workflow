name: docker workflow
on: [workflow_dispatch]
jobs:
    docker:
        runs-on: ubuntu-latest
        container:
            image: node:22-alpine
            ports:
                - "80:80"
            env:
                NODE_ENV: production
                API_URL: https://api.example.com
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Display Version Node and OS
              run: |
                  node -v
                  cat /etc/os-release
                  uname -a
            - name: Display Environment Variables
              run: |
                  echo "NODE_ENV: $NODE_ENV"
                  echo "API_URL: $API_URL"
            - name: Create a file
              run: |
                  echo "This is a test file created inside the Docker container." > testfile.txt
                  ls -l
            - name: Docker in step
              uses: docker://node:21-alpine
              with:
                  entrypoint: /usr/local/bin/node
                  args: -p 2+3
            - name: Log version of Node.js in step
              uses: docker://node:20-alpine
              with:
                  args: -v
            - name: Log version of Node.js in step
              uses: docker://node:20-alpine
              with:
                  entrypoint: cat
                  args: testfile.txt
            - name: Run a bash scrip
              uses: docker://node:20-alpine
              with:
                  entrypoint: ls
                  #args: "Some text to pass to the script"
